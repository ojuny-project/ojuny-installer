---
modules-search: [ local, @out@/lib/calamares/modules ]

instances:
- id: template
  module: notesqml
  config: template.conf
- id: origin
  module: notesqml
  config: origin.conf
- module: ojuny
  weight: 48

sequence:
- show:
  - welcome
  - notesqml@template
  - locale
  - keyboard
  - users
  - notesqml@origin
  - partition
  - summary
- exec:
  - partition
  - mount
  - ojuny
  - umount
- show:
  - finished

branding: ojuny
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
